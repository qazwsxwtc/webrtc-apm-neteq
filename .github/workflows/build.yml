name: Build WebRTC APM + NetEq

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Windows — MSVC, both Debug and Release
  # ============================================================
  windows:
    name: Windows (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S . -B build/${{ matrix.config }} `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DCMAKE_INSTALL_PREFIX=install/${{ matrix.config }} `
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: Build ${{ matrix.config }}
        run: |
          cmake --build build/${{ matrix.config }} --parallel

      - name: List outputs
        run: |
          Get-ChildItem -Recurse build/${{ matrix.config }}/*.lib, build/${{ matrix.config }}/*.exe |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            build/${{ matrix.config }}/*.lib
            build/${{ matrix.config }}/*.exe
            build/${{ matrix.config }}/example/*.exe

  # ============================================================
  # Linux — GCC + Clang (Ubuntu), Release only
  # ============================================================
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            c: gcc
            cxx: g++
          - compiler: clang
            c: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Configure CMake
        run: |
          cmake -S . -B build/${{ matrix.compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: Build
        run: cmake --build build/${{ matrix.compiler }} --parallel --verbose 2>&1 | tee build_${{ matrix.compiler }}.log

      - name: Show errors from build log
        if: failure()
        run: |
          echo "=== First 50 error lines ==="
          grep -n "error:\|Error\|undefined reference" build_${{ matrix.compiler }}.log | head -50 || true

      - name: List outputs
        run: |
          find build/${{ matrix.compiler }} -name "*.a" -o -name "*.so" -o -name "basic_apm" | sort

      - name: Upload artifacts
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            build/${{ matrix.compiler }}/*.a
            build/${{ matrix.compiler }}/example/*

  # ============================================================
  # macOS — Apple Clang, x86_64 and arm64
  # ============================================================
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build/${{ matrix.arch }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DAPM_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build/${{ matrix.arch }} --parallel

      - name: List outputs
        run: |
          find build/${{ matrix.arch }} -name "*.a" -o -name "basic_apm" | sort

      - name: Upload artifacts
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: |
            build/${{ matrix.arch }}/*.a
            build/${{ matrix.arch }}/example/*

  # ============================================================
  # Android — NDK toolchain, armeabi-v7a + arm64-v8a + x86_64
  # ============================================================
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            arch: armv7a-linux-androideabi
          - abi: arm64-v8a
            arch: aarch64-linux-android
          - abi: x86_64
            arch: x86_64-linux-android

    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          sudo apt-get update && sudo apt-get install -y zip unzip
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip -d $HOME
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r27b" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -S . -B build/android/${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPM_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build/android/${{ matrix.abi }} --parallel

      - name: List outputs
        run: |
          find build/android/${{ matrix.abi }} -name "*.a" | sort

      - name: Upload artifacts
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a-release
          path: build/android/${{ matrix.abi }}/*.a

  # ============================================================
  # iOS — Xcode SDK, arm64 (device) + x86_64 (simulator)
  # ============================================================
  ios:
    name: iOS (${{ matrix.sdk }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            platform: OS64
          - sdk: iphonesimulator
            platform: SIMULATOR64

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build/ios/${{ matrix.sdk }} \
            -G "Xcode" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPM_BUILD_EXAMPLES=OFF

      - name: Build
        run: |
          cmake --build build/ios/${{ matrix.sdk }} \
            --config Release \
            -- \
            -sdk ${{ matrix.sdk }} \
            -configuration Release

      - name: List outputs
        run: |
          find build/ios/${{ matrix.sdk }} -name "*.a" | sort

      - name: Upload artifacts
        if: matrix.sdk == 'iphoneos'
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-release
          path: build/ios/${{ matrix.sdk }}/*.a